<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>자리배치도 · wylie</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bar">
    <div class="brand"><span class="dot"></span>wylie<span class="sub">Seating</span></div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="이름 · 부서 · 직급 검색" autocomplete="off"/></div>
    <button class="iconbtn" id="fit" title="화면 맞춤"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m0 8v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3m0-8V5a2 2 0 0 0-2-2h-3"/></svg></button>
    <button class="iconbtn" id="measBtn" title="치수선 (선 긋고 길이 입력 · 전체 보기/숨기기)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="7.5" width="19" height="9" rx="1.5" transform="rotate(-20 12 12)"/><path d="M6.5 9.7v2M9.7 8.5v3M12.9 7.4v2M16.1 6.2v3" transform="rotate(-20 12 12)"/></svg></button>
    <button class="iconbtn" id="pngBtn" title="이미지(PNG) 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
    <button class="iconbtn" id="printBtn" title="인쇄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
    <button class="iconbtn" id="areaBtn" title="면적 · 부서별 비용 집계"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
    <button class="btn" id="editBtn">관리자 편집</button>
  </div>

  <div class="mtool">
    <div class="seg" id="floors"></div>
    <div class="floccu" id="floccu"></div>
    <div class="spacer"></div>
    <div class="editbar" id="editbar" hidden>
      <button class="btn sm" data-add="desk">＋좌석</button>
      <button class="btn sm" data-add="facility">＋시설</button>
      <button class="btn sm" data-add="label">＋텍스트</button>
      <button class="btn sm" data-add="wall">🧱 벽</button>
      <button class="btn sm" data-add="line">＋선</button>
      <button class="btn sm" data-add="rect">▭ 사각형</button>
      <button class="btn sm" data-add="ellipse">◯ 원</button>
      <button class="btn sm" data-add="door">⌒ 문</button>
      <button class="btn sm" id="bgBtn">🖼 배경도면</button>
      <input id="bgFile" type="file" accept="image/*" hidden/>
      <button class="btn sm" id="addPod">＋좌석✕N</button>
      <span class="vsep"></span>
      <button class="btn sm" id="mgrEmp">👤 임직원</button>
      <button class="btn sm" id="mgrUnseat">🧑‍💼 미배치</button>
      <button class="btn sm" id="mgrDept">🏷 부서</button>
      <button class="btn sm" id="mgrFloor">🏢 층</button>
      <button class="btn sm" id="restoreBtn">🕘 복원</button>
      <button class="btn sm" id="undoBtn" title="되돌리기 (Ctrl+Z)" disabled>↶</button>
      <button class="btn sm" id="redoBtn" title="다시 실행 (Ctrl+Shift+Z)" disabled>↷</button>
      <button class="btn sm" id="alignBtn">↔ 정렬</button>
      <button class="btn sm danger" id="delSel" disabled>삭제</button>
      <span class="vsep"></span>
      <span class="dirty" id="dirty" hidden>● 저장 안 됨</span>
      <button class="btn sm" id="saveBtn">💾 저장</button>
      <button class="btn sm primary" id="doneBtn">완료</button>
    </div>
    <div class="floccu clr" id="clrFilter" hidden>✕ 필터 해제</div>
  </div>

  <div class="wrap" id="wrap">
    <div class="stage" id="stage"><div class="paper" id="paper"><svg class="walls" id="walls"></svg><svg class="dlayer" id="dlayer"></svg><svg class="mlayer" id="mlayer"></svg></div></div>
    <div class="hint" id="hint">드래그: 이동 · 휠: 확대/축소 · 좌석 클릭: 상세</div>
  </div>
  <div class="legend" id="legend"></div>

  <div class="tip" id="tip"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel" aria-hidden="true"></aside>
  <aside class="udock" id="udock" hidden></aside>
  <div class="modalback" id="modalback" hidden><div class="modal" id="modal"></div></div>

  <script src="app.js"></script>
</body>
</html>
